<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Watermark Inspector</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #0f1115; color: #e6e8ee; }
  h1 { color: #4f8cff; }
  .panel { background: #171a21; border: 1px solid #2a2f3a; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  input, button { padding: 10px; border-radius: 8px; border: 1px solid #2a2f3a; font-size: 14px; }
  input { width: 100%; background: #1e222b; color: #e6e8ee; margin-bottom: 10px; }
  button { background: #4f8cff; color: white; font-weight: 600; cursor: pointer; border: none; }
  button:hover { filter: brightness(1.1); }
  #status { color: #8a93a6; margin-top: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-top: 20px; }
  .card { background: #1e222b; border: 1px solid #2a2f3a; border-radius: 10px; overflow: hidden; }
  .card img { width: 100%; height: 150px; object-fit: cover; display: block; }
  .card .actions { padding: 10px; display: flex; gap: 6px; }
  .card .actions a { flex: 1; text-align: center; padding: 6px; background: #4f8cff; color: white; text-decoration: none; border-radius: 6px; font-size: 12px; }
</style>
</head>
<body>
  <h1>🔎 Watermark Inspector</h1>
  <p>Cole o link de uma galeria para extrair as imagens.</p>

  <div class="panel">
    <input id="urlInput" type="url" placeholder="https://exemplo.com/evento/...">
    <button id="analyzeBtn">Analisar página</button>
    <p id="status"></p>
  </div>

  <div id="results" style="display:none">
    <h2>Imagens encontradas (<span id="count">0</span>)</h2>
    <div id="grid" class="grid"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
