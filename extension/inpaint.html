<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Processando imagens com IA</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif;
    margin: 0;
    background: #0f1115;
    color: #e6e8ee;
    min-height: 100vh;
    padding: 24px;
  }
  h1 { margin: 0 0 8px; font-size: 22px; color: #4f8cff; }
  .sub { color: #8a93a6; margin: 0 0 24px; }
  .panel {
    background: #171a21;
    border: 1px solid #2a2f3a;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .toolbar {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 16px;
  }
  button {
    padding: 10px 16px;
    border-radius: 8px;
    border: none;
    background: #4f8cff;
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.success { background: #22c55e; color: #001b0d; }
  button.warn { background: #f59e0b; color: #1a0f00; }
  .status { font-size: 13px; color: #8a93a6; margin: 8px 0; }
  .status.ok { color: #22c55e; }
  .status.error { color: #ef4444; }
  .progress-bar {
    height: 8px;
    background: #1e222b;
    border-radius: 100px;
    overflow: hidden;
    margin: 12px 0;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #4f8cff, #22c55e);
    transition: width 0.3s;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
    margin-top: 20px;
  }
  .card {
    background: #1e222b;
    border: 1px solid #2a2f3a;
    border-radius: 10px;
    overflow: hidden;
  }
  .card .preview {
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 2;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .card .preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .card .label {
    padding: 10px 12px;
    font-size: 12px;
    color: #8a93a6;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .badge {
    padding: 2px 8px;
    border-radius: 100px;
    font-size: 10px;
    font-weight: 700;
  }
  .badge.pending { background: #2a2f3a; color: #8a93a6; }
  .badge.working { background: #1e3a8a; color: #bfdbfe; }
  .badge.done { background: #14532d; color: #bbf7d0; }
  .badge.error { background: #7f1d1d; color: #fecaca; }
  .loading-overlay {
    position: absolute;
    inset: 0;
    background: rgba(15, 17, 21, 0.9);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #2a2f3a;
    border-top-color: #4f8cff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <h1>🧠 Processando imagens com IA</h1>
  <p class="sub">Remove a marca d'água com inpainting (LaMa + WebGPU). Roda 100% no seu computador.</p>

  <div class="panel">
    <div class="toolbar">
      <button id="loadModelBtn">1️⃣ Carregar modelo (~110 MB)</button>
      <button id="startBtn" disabled>2️⃣ Processar imagens</button>
      <button id="downloadAllBtn" class="success" disabled>3️⃣ Baixar tudo</button>
      <button id="abortBtn" class="warn" disabled>⏹️ Abortar</button>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <p class="status" id="status">Clique em "Carregar modelo" para começar.</p>
  </div>

  <div id="grid" class="grid"></div>

  <script src="lib/ort.webgpu.min.js"></script>
  <script src="inpaint.js"></script>
</body>
</html>
